<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>横浜駅前ながしまクリニック デジタルサイネージ</title>
<style>
  /* ---------- フォント（Zen Kaku Gothic New／OFLライセンス、文字サブセット済み） ---------- */
  /* 同じ font-family 名に太さ違いを4つ登録し、font-weight で自動的に使い分ける（v14）。
     見出し=900(Black)／kicker・ラベル=700(Bold)／本文=500(Medium)／補助=400(Regular)。
     サブセットに無い文字（対応外の漢字等）はグリフが無いため、ブラウザが自動的に
     次点のヒラギノへフォールバックする（unicode-range指定は不要）。 */
  @font-face{
    font-family:"Zen Kaku Gothic New";
    src:url("fonts/ZenKaku-Regular.woff2") format("woff2");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"Zen Kaku Gothic New";
    src:url("fonts/ZenKaku-Medium.woff2") format("woff2");
    font-weight:500;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"Zen Kaku Gothic New";
    src:url("fonts/ZenKaku-Bold.woff2") format("woff2");
    font-weight:700;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"Zen Kaku Gothic New";
    src:url("fonts/ZenKaku-Black.woff2") format("woff2");
    font-weight:900;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --bg-base:#fdfaf5;
    --bg-tint:#f4efe6;
    --text:#2c2a26;
    --text-soft:#5f5b52;
    --line:rgba(44,42,38,0.18);
    --accent:#8a8060;
    --accent2:#5f6b4f;
    --motif-color:#cfc7b2;
    --white:#ffffff;
    --radius:1.1vh;     /* v14: 角丸は12px相当（1.1vh≒1080pで約12px）まで */
    --radius-sm:0.8vh;
  }
  html[data-season="spring"]{
    --bg-tint:#fbf1f0; --accent:#c96f88; --accent2:#7fa25e; --motif-color:#eab9c6;
    --night-bg:#2b1f26; --night-accent:#e8b6c4;
  }
  html[data-season="summer"]{
    --bg-tint:#eff8f6; --accent:#3f8fc0; --accent2:#2c6a4f; --motif-color:#9ecfdc;
    --night-bg:#10262a; --night-accent:#7fc4d6;
  }
  html[data-season="autumn"]{
    --bg-tint:#fbf3e4; --accent:#c9803a; --accent2:#a9852c; --motif-color:#e0b06a;
    --night-bg:#2a2013; --night-accent:#e0b06a;
  }
  html[data-season="winter"]{
    --bg-tint:#f1f5fa; --accent:#3c5c88; --accent2:#7c8a99; --motif-color:#b9c4d1;
    --night-bg:#131b2b; --night-accent:#9fb3d6;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:var(--bg-base);
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    font-weight:500;
    color:var(--text);
    font-feature-settings:"tnum" 1;
    font-variant-numeric:tabular-nums;
  }
  body{
    background:
      radial-gradient(ellipse at 15% 10%, var(--bg-tint) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 90%, var(--bg-tint) 0%, transparent 55%),
      var(--bg-base);
    transition:background 1.5s ease;
  }
  body.cursor-hidden, body.cursor-hidden *{ cursor:none !important; }

  #app{
    position:relative; width:100vw; height:100vh; overflow:hidden;
  }

  /* ---------- 季節の装飾レイヤー ---------- */
  #motif-layer{
    position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .motif-shape{
    position:absolute; border-radius:50%;
    background:var(--motif-color);
    opacity:0.22;
  }
  html[data-season="autumn"] .motif-shape{ border-radius:20% 60% 40% 70%; }
  html[data-season="winter"] .motif-shape{ border-radius:50%; }
  @keyframes driftDown{
    from{ transform:translateY(-10vh) translateX(0) rotate(0deg); }
    to{ transform:translateY(110vh) translateX(6vw) rotate(180deg); }
  }
  @keyframes floatUp{
    0%{ transform:translateY(10vh) translateX(0); }
    50%{ transform:translateY(-4vh) translateX(2vw); }
    100%{ transform:translateY(10vh) translateX(0); }
  }
  .motif-drift{ animation-name:driftDown; animation-timing-function:linear; animation-iteration-count:infinite; }
  .motif-float{ animation-name:floatUp; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }

  .wave-decor{
    position:absolute; left:-10%; right:-10%; bottom:8vh; height:22vh;
    background:var(--bg-tint);
    opacity:0.55;
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    z-index:0;
  }

  /* ---------- スライド共通（v14: 脱・中央揃え／左揃え非対称グリッド） ---------- */
  #slides{
    position:absolute; inset:0; top:0; bottom:8vh; z-index:1;
  }
  .slide{
    --fit:1; /* オートフィット倍率（JSが内容量に応じて調整。既定は等倍） */
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    padding:6vh 6vw 6vh 8vw; /* 左マージン8vwのコンテンツ軸 */
    opacity:0; transform:translateY(3vh);
    transition:opacity 1s ease, transform 1s ease;
    text-align:left;
  }
  .slide.active{ opacity:1; transform:translateY(0); z-index:2; }

  /* 診療時間表・内視鏡実績・WEB予約QRは中央揃えのまま維持する */
  .slide.slide-centered{
    align-items:center; justify-content:center; text-align:center;
    padding:4vh 6vw;
  }

  /* コンテンツ領域の上下に極細罫線（画像・ポスター系／中央維持系は除く） */
  .slide.theme-bold, .slide.has-poster{ --line:rgba(255,255,255,0.22); }
  .slide:not(.has-image):not(.has-poster):not(.slide-centered)::before,
  .slide:not(.has-image):not(.has-poster):not(.slide-centered)::after{
    content:""; position:absolute; left:8vw; right:6vw; height:1px; background:var(--line);
  }
  .slide:not(.has-image):not(.has-poster):not(.slide-centered)::before{ top:5vh; }
  .slide:not(.has-image):not(.has-poster):not(.slide-centered)::after{ bottom:5vh; }

  /* 画面右端の縦書きセクションラベル（kicker文言を流用、淡色） */
  .side-label{
    position:absolute; right:2.6vw; top:50%; transform:translateY(-50%);
    writing-mode:vertical-rl; text-orientation:mixed;
    font-size:1.5vh; letter-spacing:0.34em; font-weight:700;
    color:var(--text-soft); opacity:0.38;
    pointer-events:none; white-space:nowrap; max-height:70vh; overflow:hidden;
  }

  .kicker{
    display:inline-flex; align-items:center; gap:calc(0.9vw * var(--fit));
    font-size:calc(2vh * var(--fit)); letter-spacing:0.24em; color:var(--accent);
    font-weight:700; margin-bottom:calc(1.8vh * var(--fit));
  }
  .kicker::before{
    content:""; display:inline-block; width:calc(2.2vw * var(--fit)); height:1px; background:var(--accent);
    flex:none;
  }
  .headline{
    font-size:calc(10vh * var(--fit)); font-weight:900; line-height:1.15; letter-spacing:0.005em;
    color:var(--text);
  }
  .headline.small{ font-size:calc(8.5vh * var(--fit)); }
  .sub{
    font-size:calc(4vh * var(--fit)); color:var(--text-soft); margin-top:calc(2.2vh * var(--fit)); line-height:1.6; font-weight:500;
  }
  .accent-text{ color:var(--accent2); }

  /* dept-pill: 丸ピルを廃止し、細罫線区切りのタイポグラフィリストへ */
  .dept-list{
    display:flex; flex-wrap:wrap; align-items:baseline; row-gap:calc(1vh * var(--fit));
    margin-top:calc(3.6vh * var(--fit));
  }
  .dept-pill{
    font-size:calc(3.2vh * var(--fit)); font-weight:700; color:var(--text);
    border:none; border-left:1px solid var(--line); border-radius:0; background:none;
    padding:0 calc(1.8vw * var(--fit));
    line-height:1.3;
  }
  .dept-pill:first-child{ border-left:none; padding-left:0; }

  .motto-bar{
    margin-top:calc(3vh * var(--fit)); font-size:calc(3.2vh * var(--fit)); color:var(--accent); font-weight:700; letter-spacing:0.08em;
  }

  /* ---------- 疾患解説カード（v15: 症状→検査→治療→CTA。v16: 行数可変・強調タグ対応） ---------- */
  .disease-card{
    margin-top:calc(3.2vh * var(--fit));
    display:flex; flex-direction:column; gap:calc(2vh * var(--fit));
  }
  .dc-row{
    display:flex; align-items:flex-start; gap:calc(1.6vw * var(--fit));
  }
  .dc-tag{
    flex:none; margin-top:0.2em;
    display:inline-block; min-width:calc(5.4vh * var(--fit)); text-align:center;
    font-size:calc(1.9vh * var(--fit)); font-weight:700; letter-spacing:0.06em;
    color:var(--accent2); border:1px solid var(--accent2); border-radius:0;
    padding:calc(0.4vh * var(--fit)) calc(0.3vw * var(--fit));
  }
  /* v16: 「放置すると」等の1行だけ塗り＝アクセント色地に白抜きでメリハリを付ける（赤・警告色は使わない） */
  .dc-tag--filled{
    background:var(--accent2); color:#fff; border-color:var(--accent2);
  }
  /* bold/poster（濃色背景）ではaccent2が淡色のため白文字だとコントラスト不足になる。
     既存のem強調と同じ考え方（白地＋tone-dark文字）に切り替えてコントラストを確保する。 */
  .slide.theme-bold .dc-tag--filled, .slide.has-poster .dc-tag--filled{
    background:#fff; color:var(--tone-dark, #333); border-color:#fff;
  }
  .dc-text{
    font-size:calc(3.6vh * var(--fit)); color:var(--text); font-weight:500; line-height:1.5;
  }
  .dc-cta{
    margin-top:calc(2.6vh * var(--fit)); padding-top:calc(1.8vh * var(--fit));
    border-top:1px solid var(--line);
    font-size:calc(3vh * var(--fit)); font-weight:700; color:var(--accent);
    letter-spacing:0.02em;
  }

  /* ---------- 番号ステップ行（v18: diseaseCardのrowsに{step,text}を渡すと丸数字バッジになる） ---------- */
  .dc-step{
    flex:none; margin-top:0.1em;
    width:calc(4.6vh * var(--fit)); height:calc(4.6vh * var(--fit)); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent2); color:#fff;
    font-size:calc(2.3vh * var(--fit)); font-weight:900;
    font-variant-numeric:tabular-nums;
  }
  /* bold/poster（濃色背景）ではaccent2が淡色のため、dc-tag--filledと同じ考え方で白丸＋tone-dark文字に切り替える */
  .slide.theme-bold .dc-step, .slide.has-poster .dc-step{
    background:#fff; color:var(--tone-dark, #333);
  }
  .single-step{
    margin-top:calc(3vh * var(--fit));
    display:grid; grid-template-columns:auto minmax(0, 1fr); align-items:center;
    column-gap:calc(2.4vw * var(--fit));
  }
  .single-step .step-big{
    width:calc(12vh * var(--fit)); height:calc(12vh * var(--fit)); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#fff; color:var(--tone-dark, #333);
    font-size:calc(6.6vh * var(--fit)); font-weight:900; line-height:1;
    box-shadow:0 1vh 2.4vh rgba(0,0,0,0.18);
    font-variant-numeric:tabular-nums;
  }
  .single-step .step-text{
    font-size:calc(4.2vh * var(--fit)); line-height:1.42; font-weight:700; color:var(--text);
  }
  .number-callout{
    margin-top:calc(2.6vh * var(--fit));
    display:flex; align-items:baseline; gap:1.4vw; flex-wrap:wrap;
  }
  .number-callout .num{
    font-size:calc(14vh * var(--fit)); line-height:0.95; font-weight:900;
    color:var(--accent2); letter-spacing:0;
  }
  .number-callout .label{
    font-size:calc(4.4vh * var(--fit)); line-height:1.2; font-weight:700;
    color:var(--text);
  }

  /* ---------- ビルドアップアニメ（v18: スライドがactiveになったら .dc-row／.point が0.4秒間隔で順にフェードイン） ---------- */
  .disease-card .dc-row,
  .point-list .point{
    opacity:0; transform:translateY(1.2vh);
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  .slide.active .disease-card .dc-row,
  .slide.active .point-list .point{
    opacity:1; transform:translateY(0);
  }
  .slide.active .disease-card .dc-row:nth-child(1), .slide.active .point-list .point:nth-child(1){ transition-delay:0.05s; }
  .slide.active .disease-card .dc-row:nth-child(2), .slide.active .point-list .point:nth-child(2){ transition-delay:0.45s; }
  .slide.active .disease-card .dc-row:nth-child(3), .slide.active .point-list .point:nth-child(3){ transition-delay:0.85s; }
  .slide.active .disease-card .dc-row:nth-child(4), .slide.active .point-list .point:nth-child(4){ transition-delay:1.25s; }
  .slide.active .disease-card .dc-row:nth-child(5), .slide.active .point-list .point:nth-child(5){ transition-delay:1.65s; }
  .slide.active .disease-card .dc-row:nth-child(6), .slide.active .point-list .point:nth-child(6){ transition-delay:2.05s; }
  @media (prefers-reduced-motion: reduce){
    .disease-card .dc-row, .point-list .point{ opacity:1 !important; transform:none !important; transition:none !important; }
  }

  /* ---------- 章扉スライド（v18: chapterSlide()ヘルパー。「◯◯とは／検査の目的／検査の流れ」等の見出しだけの5秒画面） ---------- */
  .chapter-wrap{
    width:100%; display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .chapter-wrap .kicker{ justify-content:center; }
  .chapter-title{
    font-size:calc(12vh * var(--fit));
    position:relative; display:inline-block;
    padding-bottom:calc(2.2vh * var(--fit));
  }
  .chapter-title::after{
    content:""; position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:7vh; height:0.6vh; border-radius:999px; background:var(--accent);
  }
  .chapter-visual{
    width:100%; display:flex; align-items:center; justify-content:center; gap:4vw;
  }
  .chapter-icon{
    width:24vh; height:24vh; border-radius:50%; overflow:hidden;
    border:0.5vh solid rgba(255,255,255,0.75);
    box-shadow:0 1.2vh 3vh rgba(0,0,0,0.18);
    flex:none;
  }
  .chapter-icon img{
    display:block; width:100%; height:100%; object-fit:cover;
  }
  .chapter-copy{ display:flex; flex-direction:column; align-items:flex-start; text-align:left; }
  .chapter-copy .chapter-title::after{ left:0; transform:none; }

  /* ---------- 診療時間表 ---------- */
  .hours-wrap{ width:100%; max-width:88vw; }
  table.hours-table{
    width:100%; border-collapse:collapse; margin-top:calc(2vh * var(--fit));
  }
  table.hours-table th, table.hours-table td{
    border-bottom:0.15vh solid var(--line);
    padding:calc(1.8vh * var(--fit)) calc(0.6vw * var(--fit));
    font-size:calc(4vh * var(--fit));
    text-align:center;
  }
  table.hours-table th{
    color:var(--text-soft); font-weight:700; font-size:calc(3.4vh * var(--fit));
  }
  table.hours-table td.mark-open{ color:var(--accent2); font-size:calc(4.8vh * var(--fit)); font-weight:900; }
  table.hours-table td.mark-close{ color:var(--text-soft); font-size:calc(4vh * var(--fit)); }
  table.hours-table td.day-label{ font-weight:700; color:var(--text); }
  table.hours-table .time-note{ font-size:calc(2.2vh * var(--fit)); color:var(--text-soft); }
  .hours-note{ margin-top:calc(2.8vh * var(--fit)); font-size:calc(4vh * var(--fit)); color:var(--text-soft); line-height:1.7; }
  .hours-note strong{ color:var(--accent); }

  /* ---------- 内視鏡実績 ---------- */
  .huge-number{
    font-size:calc(22vh * var(--fit)); font-weight:900; color:var(--accent2); line-height:1;
    letter-spacing:0.01em;
  }
  .huge-number .unit{ font-size:calc(6vh * var(--fit)); margin-left:1vw; color:var(--text); font-weight:700; }
  .breakdown{
    display:flex; gap:6vw; margin-top:calc(4vh * var(--fit)); justify-content:center;
  }
  .breakdown .item{ font-size:calc(3.2vh * var(--fit)); color:var(--text-soft); }
  .breakdown .item b{ display:block; font-size:calc(6vh * var(--fit)); color:var(--accent); font-weight:900; }
  .month-badge{
    margin-top:calc(4vh * var(--fit)); font-size:calc(2.8vh * var(--fit)); color:var(--text-soft);
    background:rgba(255,255,255,0.6); border-radius:var(--radius-sm); padding:calc(2vh * var(--fit)) calc(3vw * var(--fit));
  }
  .month-badge b{ color:var(--accent2); font-size:calc(4vh * var(--fit)); }
  .mini-photo-card{
    position:absolute; right:6vw; top:18vh; width:28vw; max-width:50vh;
    background:#fff; border-radius:var(--radius); padding:1vh;
    box-shadow:0 1.2vh 3vh rgba(0,0,0,0.2);
  }
  .mini-photo-card img{
    display:block; width:100%; aspect-ratio:16/9; object-fit:cover;
    border-radius:var(--radius-sm);
  }
  .mini-photo-card + *{ position:relative; }

  /* ---------- 案内リスト（胃/大腸カメラ等） ---------- */
  .point-list{
    margin-top:calc(4vh * var(--fit)); display:flex; flex-direction:column; gap:calc(2.6vh * var(--fit)); align-items:flex-start;
  }
  .point-list .point{
    position:relative;
    font-size:calc(4vh * var(--fit)); color:var(--text); font-weight:500; text-align:left;
    line-height:1.4;
    padding-left:calc(1.6vh * var(--fit) + 1.4vw * var(--fit));
  }
  .point-list .point .dot{
    position:absolute; left:0; top:0.55em;
    width:calc(1vh * var(--fit)); height:calc(1vh * var(--fit)); border-radius:0; background:var(--accent);
  }
  .point-list:has(.point:nth-child(4)){
    gap:calc(1.8vh * var(--fit));
  }
  .point-list:has(.point:nth-child(4)) .point{
    padding-left:0;
  }
  .point-list:has(.point:nth-child(4)) .point .dot{
    display:none;
  }

  /* ---------- 2カラムレイアウト（access等） ---------- */
  .two-col{
    display:flex; gap:5vw; width:100%; max-width:80vw; margin-top:calc(3vh * var(--fit)); text-align:left;
  }
  .two-col .col{ flex:1; }
  .access-label{ font-size:calc(2.2vh * var(--fit)); color:var(--text-soft); margin-bottom:calc(0.6vh * var(--fit)); margin-top:calc(2.4vh * var(--fit)); }
  .access-label:first-child{ margin-top:0; }
  .access-line{ font-size:calc(4vh * var(--fit)); color:var(--text); font-weight:700; }

  /* ---------- 番号付きリスト（横浜市の検診等） ---------- */
  .numbered-list{
    margin-top:calc(4vh * var(--fit)); display:flex; flex-direction:column; gap:calc(2.4vh * var(--fit)); align-items:flex-start;
  }
  .numbered-list .n-item{
    position:relative;
    padding-left:calc(5vh * var(--fit) + 1.6vw * var(--fit));
    min-height:calc(5vh * var(--fit));
    font-size:calc(4vh * var(--fit)); font-weight:700; color:var(--text); text-align:left; line-height:calc(5vh * var(--fit));
  }
  .numbered-list .n-badge{
    position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:calc(5vh * var(--fit)); height:calc(5vh * var(--fit)); border-radius:50%; background:var(--accent2); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:calc(2.6vh * var(--fit)); font-weight:900;
  }

  /* ---------- 特集シリーズ（右上丸バッジを廃止し、背後の特大ゴースト数字＋小ラベルへ） ---------- */
  .series-badge{
    position:absolute; top:0; right:0; z-index:0;
    display:flex; flex-direction:column; align-items:flex-end;
    text-align:right; pointer-events:none;
    padding:2.4vh 3.5vw 0 0;
  }
  .series-ghost{
    font-size:20vh; font-weight:900; line-height:0.78;
    color:var(--text); opacity:0.08;
    letter-spacing:-0.02em; font-variant-numeric:tabular-nums;
  }
  .series-label{
    margin-top:0.4vh; font-size:1.7vh; font-weight:700; letter-spacing:0.14em;
    color:var(--accent2); white-space:nowrap;
  }

  /* ---------- QRコード（WEB予約） ---------- */
  .qr-layout{ align-items:center; }
  .qr-col{ display:flex; align-items:center; justify-content:center; }
  .qr-card{
    background:#ffffff; border-radius:var(--radius); padding:2vh;
    box-shadow:0 0 0 0.15vh var(--line);
  }
  .qr-image{ display:block; width:35vh; height:35vh; }

  /* ---------- 画像つきスライド（左テキスト55%／右イラスト45%） ---------- */
  .img-layout{

  /* ---------- キーワード強調（<em>） ---------- */

  em{
    font-style:normal;
    background-image:linear-gradient(180deg, transparent 58%, rgba(154,111,45,0.32) 58%);

  }
  /* bold・poster共通: 白帯ボックス（テーマ色文字・角丸・水平のまま、v14で回転をやめた） */

  /* ---------- tone（色系統）: --tone-dark はbold/posterどちらでも使うので独立させておく ---------- */

  .tone-navy{ --tone-dark:#2b3a5c; }

  /* ---------- Bold（ベタ塗り）テーマ：Sokoの構図を借りたポスター調バリアント ---------- */

  .slide.theme-bold{

  .slide.theme-bold.tone-rose{ background-color:#96636c; --text:#faf1f0; --text-soft:#ecdadc; --accent:#f0dde0; --accent2:#e3c1c6; } /* v14: スモーキーローズ */
  .slide.theme-bold.tone-navy{ background-color:#2b3a5c; --text:#f2f4f9; --text-soft:#c7d0e2; --accent:#bcd0f0; --accent2:#a9c0e6; }

  /* ---------- フルポスタースライド（背景全面に写真・空きスペース側に白文字） ---------- */
  .slide.has-poster{

  .poster-text-col{

  /* テキスト3要素は少し遅れて順に入場する（stagger） */

  /* ---------- 装飾モチーフ（v14: ハート/カプセル/＋を廃止し、極薄の円弧1本のみに） ---------- */
  .deco-layer{ position:absolute; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }

  /* ---------- 日曜の帯 ---------- */

  /* ---------- フッター ---------- */
  #footer{

  /* 院名・所在地・時計は折り返し禁止＆縮まない。幅が足りない場合は#progress側が縮む */
  #footer .footer-left{

  #footer .clinic-loc{ font-size:1.9vh; color:var(--text-soft); white-space:nowrap; }

  #progress{

  #progress.counter-mode #progress-counter{ display:inline-block; }
</style>
</head>
<body>
<div id="app">
  <div id="motif-layer"></div>
  <div class="wave-decor"></div>

  <div id="slides"></div>
  <div id="night-screen"></div>
  <footer id="footer">
    <div class="footer-left">
      <span class="clinic-name" id="footer-name"></span>
      <span class="clinic-loc" id="footer-loc"></span>
    </div>
    <div class="footer-clock">
      <span class="date-part" id="footer-date"></span>
      <span id="footer-time"></span>
    </div>
    <div id="progress">
      <div id="dots"></div>
      <span id="progress-counter"></span>
    </div>
  </footer>
</div>

<script src="slides.js"></script>
<script>
/* =====================================================================
   横浜駅前ながしまクリニック デジタルサイネージ：エンジン部分（index.html）
   ---------------------------------------------------------------------
   データ（NIGHT_MODE・CLINIC・QR_YOYAKU・NOTICE・SLIDES）は slides.js 側です。
   ここにはローテーション・季節判定・夜間モードなどの動作ロジックのみがあります。
   通常は編集不要です。
   ===================================================================== */




/* =====================================================================
   以下はエンジン部分です。通常は編集不要です。
   ===================================================================== */

// ---------- ユーティリティ ----------
function formatNum(n){
  return Number(n).toLocaleString("ja-JP");
}

function renderHoursTable(h){
  const cell = (v, timeOpen, timeNote) => {
    if (v === true) return `<td class="mark-open">○</td>`;
    if (v === "note") return `<td class="mark-open">○</td>`;
    return `<td class="mark-close">×</td>`;
  };
  return `
    <table class="hours-table">
      <thead>
        <tr>
          <th></th>
          ${h.days.map(d => `<th>${d}</th>`).join("")}
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="day-label">午前<br><span class="time-note">${h.amTime}</span></td>
          ${h.am.map(v => cell(v)).join("")}
        </tr>
        <tr>
          <td class="day-label">午後<br><span class="time-note">${h.pmTime}</span></td>
          ${h.pm.map(v => cell(v)).join("")}
        </tr>
      </tbody>
    </table>
  `;
}

const WEEKDAY_KANJI = ["日", "月", "火", "水", "木", "金", "土"];

function seasonOf(month){
  if ([3, 4, 5].includes(month)) return "spring";
  if ([6, 7, 8, 9].includes(month)) return "summer";
  if ([10, 11].includes(month)) return "autumn";
  return "winter"; // 12, 1, 2
}

// 夜間モードの時間帯（日をまたぐ場合にも対応）かどうかを判定する
function isWithinNightWindow(hour, minute){
  const startMin = NIGHT_MODE.startHour * 60 + NIGHT_MODE.startMinute;
  const endMin = NIGHT_MODE.endHour * 60 + NIGHT_MODE.endMinute;
  const nowMin = hour * 60 + minute;
  if (startMin === endMin) return false; // 設定ミス時は夜間モードにしない
  return nowMin >= startMin || nowMin < endMin;
}

// ---------- URLパラメータ ----------
const params = new URLSearchParams(location.search);
const monthParamRaw = parseInt(params.get("month"), 10);
const monthParam = (monthParamRaw >= 1 && monthParamRaw <= 12) ? monthParamRaw : null;
const speedParam = parseFloat(params.get("speed")) || 1;
const startSlideParam = params.get("slide");
const freezeParam = params.get("freeze") === "1"; // プレビュー用：指定スライドのままローテーションを止める
const forceNoticeParam = params.get("forcenotice") === "1"; // プレビュー用：NOTICE.enabled=falseでも notice スライドを表示する

// 整数のみ許可（小数不可）のURLパラメータを読む。範囲外・小数・非数値は null（＝実際の値を使う）
function parseIntParamStrict(name, min, max){
  const raw = params.get(name);
  if (raw === null || raw.includes(".")) return null;
  const n = parseInt(raw, 10);
  if (!Number.isFinite(n) || n < min || n > max) return null;
  return n;
}
const hourParam = parseIntParamStrict("hour", 0, 23);   // 夜間モード判定用（検証用）
const dowParam = parseIntParamStrict("dow", 0, 6);       // 曜日判定用（0=日曜、検証用）

const now0 = new Date();
const effectiveMonth = monthParam || (now0.getMonth() + 1);
const currentSeason = seasonOf(effectiveMonth);
document.documentElement.setAttribute("data-season", currentSeason);

// ---------- 季節モチーフ生成 ----------
function buildMotifLayer(season){
  const layer = document.getElementById("motif-layer");
  layer.innerHTML = "";
  const count = 10;
  for (let i = 0; i < count; i++){
    const el = document.createElement("div");
    el.className = "motif-shape " + (season === "summer" ? "motif-float" : "motif-drift");
    const size = 1.2 + Math.random() * 2.4; // vh
    el.style.width = size + "vh";
    el.style.height = size + "vh";
    el.style.left = (Math.random() * 96) + "vw";
    el.style.top = (Math.random() * 90) + "vh";
    const duration = 18 + Math.random() * 22;
    el.style.animationDuration = duration + "s";
    el.style.animationDelay = (-Math.random() * duration) + "s";
    layer.appendChild(el);
  }
}
buildMotifLayer(currentSeason);

// ---------- スライドの絞り込み ----------
function filterSlides(month){
  const isEnabled = s => (s.id === "notice" && forceNoticeParam) ? true : s.enabled !== false; // enabled:false のスライド（notice等）は非表示にする
  let list = SLIDES.filter(s => isEnabled(s) && (s.months === "all" || (Array.isArray(s.months) && s.months.includes(month))));
  if (list.length === 0) list = SLIDES.filter(s => isEnabled(s) && s.months === "all");
  if (list.length === 0) list = SLIDES.filter(isEnabled);
  return list;
}

// ---------- 表示頻度の重み（weight）を反映した周回リストを作る ----------
// weight:2 のスライドは1周の中で2回表示する。同じスライドが連続しないよう、
// 2回目は「元の位置からおよそ半周ずれた位置」に差し込む。
function buildWeightedRotation(baseList){
  const result = baseList.slice(); // まず1回ずつ並べる
  baseList.forEach(s => {
    const extraCount = Math.max(1, s.weight || 1) - 1; // weight:2 なら追加1回、weight:1（省略時）なら0回
    for (let k = 0; k < extraCount; k++){
      const n = result.length;
      if (n === 0) continue;
      const originalPos = result.indexOf(s);
      let pos = (originalPos + Math.floor(n / 2)) % n;
      // 直前・直後が同じスライドにならないよう、必要ならずらす
      let guard = 0;
      while (
        guard < n &&
        (result[(pos - 1 + n) % n] === s || result[pos % n] === s)
      ){
        pos = (pos + 1) % n;
        guard++;
      }
      result.splice(pos, 0, s);
    }
  });
  return result;
}

const activeSlides = buildWeightedRotation(filterSlides(effectiveMonth));

// ---------- DOM構築 ----------
const slidesRoot = document.getElementById("slides");
const dotsRoot = document.getElementById("dots");
const slideEls = [];

const BG_PATTERNS = ["bg-pattern-a", "bg-pattern-b", "bg-pattern-c"];

// s.poster があれば背景全面ポスター＋空きスペース側に白文字、s.image があれば
// 「左テキスト55%／右イラスト45%」の2カラムに自動で組む（poster優先）
function buildSlideHTML(s){
  const content = s.render();
  const deco = (s.category === "seasonal") ? "" : buildDecoLayer(); // 季節スライドは既存の季節モチーフを優先し、装飾アイコンは重ねない
  if (s.poster){
    const side = s.posterTextSide === "right" ? "right" : "left";
    return deco + `
      <div class="poster-bg" style="background-image:url('${s.poster}')"></div>
      <div class="poster-scrim side-${side}"></div>
      <div class="poster-text-col side-${side}">${content}</div>
    `;
  }
  if (s.image){
    return deco + `
      <div class="img-layout${s.imageReverse ? " img-reverse" : ""}">
        <div class="img-text-col">${content}</div>
        <div class="img-media-col"><div class="img-card"><img src="${s.image}" alt="" loading="lazy"></div></div>
      </div>
    `;
  }
  return deco + content;
}

// ---------- 装飾モチーフ（v14: 極薄の円弧1本のみ） ----------
// 各スライドの右下に、ごく薄い円弧を1つだけ配置する（実際の色・不透明度はCSS側 .deco-arc で管理）。
function buildDecoLayer(){
  return `<div class="deco-layer"><span class="deco-arc"></span></div>`;
}

// ---------- 特集シリーズの背後ゴースト数字（v14: 右上丸バッジを置き換え） ----------
// slides.js 側は "更年期特集 1/2" のような表示文言だけを渡す（文言は変更しない）。
// ここでは末尾の "n/m" から現在の回数 n を取り出し、01/02...の特大ゴースト数字を添える。
function seriesBadge(label){
  const m = String(label).match(/(\d+)\s*\/\s*\d+\s*$/);
  const num = m ? m[1].padStart(2, "0") : "";
  return `<div class="series-badge"><span class="series-ghost">${num}</span><span class="series-label">${label}</span></div>`;
}

// ---------- 疾患解説カード（v15: 3段構成 → v16: 行数可変・強調タグ対応 → v17: cta省略可 → v18: headline省略可・番号ステップ行対応） ----------
// o = { kicker, headline?, rows:[{label,text,emphasis?} または {step,text}, ...], cta? }
// rows は3〜4行など可変。emphasis:true の行だけタグを塗り（.dc-tag--filled）にしてメリハリを付ける。
// rows の各行に label の代わりに step（数値）を渡すと、タグの代わりに丸数字バッジ（.dc-step）になる
// （「検査の流れ」のようなステップ紹介スライドで使う。①②③...は step:1,2,3 のように渡す）。
// headline は省略可（キーを渡さなければ見出しなしで、kicker＋rowsだけのスライドになる）。
// cta は省略可（シリーズ物の中間スライドなど、結びの1行が不要なときはキーを渡さなければ表示されない）。
// 画像つきスライド（image/imageReverse）はこの戻り値がそのまま .img-text-col の中身になる。
function diseaseCard(o){
  const rows = o.rows.map(r => {
    if (r.step !== undefined){
      return `<div class="dc-row"><span class="dc-step">${r.step}</span><div class="dc-text">${r.text}</div></div>`;
    }
    return `<div class="dc-row"><span class="dc-tag${r.emphasis ? " dc-tag--filled" : ""}">${r.label}</span><div class="dc-text">${r.text}</div></div>`;
  }).join("");
  const headlineHtml = o.headline ? `<div class="headline small">${o.headline}</div>` : "";
  const ctaHtml = o.cta ? `<div class="dc-cta">${o.cta}</div>` : "";
  return `
    <div class="kicker">${o.kicker}</div>
    ${headlineHtml}
    <div class="disease-card">${rows}</div>
    ${ctaHtml}
  `;
}

// ---------- 章扉スライド（v18: 「◯◯とは／検査の目的／検査の流れ」等、見出しだけを見せる区切り画面） ----------
// seriesLabel は画面左上と同じ位置に出す小さなラベル（kickerと同じ役割）、title が中央に特大表示される章タイトル。
// ghost数字（seriesBadge）は使わない。呼び出し側のスライド定義では duration:5・theme:"bold"・tone・centered:true を指定すること。
function chapterSlide(seriesLabel, title){
  return `
    <div class="chapter-wrap">
      <div class="kicker">${seriesLabel}</div>
      <div class="headline chapter-title">${title}</div>
    </div>
  `;
}

// ---------- オートフィット（文字サイズの自動調整） ----------
// スライドの内容量（実際のコンテンツ高さ）と利用可能な高さ（フッターを除く表示領域）を比較し、
// 余白が目立つ（内容が少ない）スライドは --fit（font-size倍率）を上げて拡大表示する。
// 逆にはみ出しそうなときは縮小して収める。見出しの折返しが増える場合はそこで打ち切る。
const FIT_MIN = 0.7;
const FIT_MAX = 1.5;
const FIT_STEP = 0.05;
const FIT_TARGET_LOW = 0.75;   // これ未満なら「余白が目立つ」とみなして拡大を試みる
const FIT_SAFE_MAX = 0.97;     // これを超えたら「はみ出しの危険あり」とみなして一段戻す

function unionContentHeight(elements){
  let top = Infinity, bottom = -Infinity;
  elements.forEach(c => {
    if (c.classList && c.classList.contains("deco-layer")) return; // 装飾レイヤー（inset:0）は計測対象外
    const r = c.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return; // 非表示要素は無視
    if (r.top < top) top = r.top;
    if (r.bottom > bottom) bottom = r.bottom;
  });
  if (top === Infinity) return 0;
  return bottom - top;
}

// 画像つき／ポスタースライドはテキスト側（colSelector）だけを計測し、それ以外は直下の子要素をまとめて計測する
function measureContentHeight(el, colSelector){
  if (colSelector){
    const col = el.querySelector(colSelector);
    if (!col || !col.children.length) return 0;
    return unionContentHeight(Array.from(col.children));
  }
  return unionContentHeight(Array.from(el.children));
}

function getHeadlineHeight(el){
  const h = el.querySelector(".headline");
  return h ? h.getBoundingClientRect().height : 0;
}

function applyAutoFit(el, colSelector){
  try {
    const cs = getComputedStyle(el);
    const padTop = parseFloat(cs.paddingTop) || 0;
    const padBottom = parseFloat(cs.paddingBottom) || 0;
    const available = el.clientHeight - padTop - padBottom;
    if (!(available > 0)) return;

    el.style.setProperty("--fit", "1");
    void el.offsetHeight; // 強制リフロー
    let fit = 1;
    let ratio = measureContentHeight(el, colSelector) / available;
    const baseHeadlineH = getHeadlineHeight(el);

    if (ratio > FIT_SAFE_MAX){
      // はみ出し気味 → 収まるまで縮小
      while (fit > FIT_MIN){
        fit = Math.max(FIT_MIN, +(fit - FIT_STEP).toFixed(2));
        el.style.setProperty("--fit", String(fit));
        void el.offsetHeight;
        ratio = measureContentHeight(el, colSelector) / available;
        if (ratio <= FIT_SAFE_MAX || fit <= FIT_MIN) break;
      }
    } else if (ratio < FIT_TARGET_LOW){
      // 余白が目立つ → 収まる範囲で拡大（見出しの折返しが増えたら一段戻して打ち切り）
      while (fit < FIT_MAX){
        const nextFit = Math.min(FIT_MAX, +(fit + FIT_STEP).toFixed(2));
        el.style.setProperty("--fit", String(nextFit));
        void el.offsetHeight;
        const nextRatio = measureContentHeight(el, colSelector) / available;
        const nextHeadlineH = getHeadlineHeight(el);
        const wrapIncreased = baseHeadlineH > 0 && nextHeadlineH > baseHeadlineH * nextFit * 1.15;
        if (nextRatio > FIT_SAFE_MAX || wrapIncreased){
          el.style.setProperty("--fit", String(fit)); // 一段戻す
          void el.offsetHeight;
          break;
        }
        fit = nextFit;
        ratio = nextRatio;
        if (ratio >= FIT_TARGET_LOW) break;
      }
    }
    el.dataset.fit = String(fit);
  } catch (e){
    console.error("オートフィット計算エラー:", el.dataset.id || "(unknown)", e);
    el.style.setProperty("--fit", "1");
  }
}

// v14: 診療時間表・内視鏡実績・WEB予約QRのみ中央揃えレイアウトを維持する
const CENTERED_IDS = ["hours", "hours-gyn", "endoscopy-count", "web-yoyaku"];
// v18: 上記の固定id一覧に加え、スライド定義側で centered:true を指定したもの（章扉スライド等）も中央揃えにする
function isCentered(s){ return CENTERED_IDS.includes(s.id) || s.centered === true; }

activeSlides.forEach((s, i) => {
  const el = document.createElement("div");
  el.className = "slide " + BG_PATTERNS[i % BG_PATTERNS.length];
  el.dataset.id = s.id;
  if (s.image) el.classList.add("has-image");
  if (s.poster) el.classList.add("has-poster");
  if (s.tone) el.classList.add("tone-" + s.tone);
  if (s.theme === "bold") el.classList.add("theme-bold");
  if (isCentered(s)) el.classList.add("slide-centered");
  try {
    el.innerHTML = buildSlideHTML(s);
  } catch (e){
    console.error("スライド描画エラー:", s.id, e);
    el.innerHTML = `<div class="headline small">${CLINIC.name}</div>`;
  }
  // v14: 画面右端の縦書きセクションラベル（画像・ポスター・中央維持系は除く。kicker文言を流用）
  if (!s.image && !s.poster && !isCentered(s)){
    const kickerEl = el.querySelector(".kicker");
    if (kickerEl && kickerEl.textContent){
      const label = document.createElement("div");
      label.className = "side-label";
      label.textContent = kickerEl.textContent;
      el.appendChild(label);
    }
  }
  slidesRoot.appendChild(el);
  const colSelector = s.poster ? ".poster-text-col" : (s.image ? ".img-text-col" : null);
  applyAutoFit(el, colSelector);
  slideEls.push(el);

  const dot = document.createElement("div");
  dot.className = "dot";
  dotsRoot.appendChild(dot);
});

const dotEls = Array.from(dotsRoot.children);

// フッター固定表示
document.getElementById("footer-name").textContent = CLINIC.name;
document.getElementById("footer-loc").textContent = CLINIC.addressShort;

// ---------- 進行表示（ドット／カウンタの自動切替） ----------
// スライド枚数が多いと、ドットの合計幅で院名が折り返してしまうため、
// 17枚以上のときは「12 / 42」形式のコンパクトなカウンタ表示に切り替える。
const PROGRESS_DOTS_MAX = 16;
const progressRoot = document.getElementById("progress");
const progressCounterEl = document.getElementById("progress-counter");
const useCounterMode = activeSlides.length > PROGRESS_DOTS_MAX;
if (useCounterMode){
  progressRoot.classList.add("counter-mode");
}
function updateProgressCounter(index){
  if (!useCounterMode) return;
  try {
    progressCounterEl.textContent = (index + 1) + " / " + activeSlides.length;
  } catch (e){
    console.error("進行カウンタ更新エラー:", e);
  }
}

// ---------- ローテーション ----------
let currentIndex = 0;
if (startSlideParam){
  const found = activeSlides.findIndex(s => s.id === startSlideParam);
  if (found >= 0) currentIndex = found;
}

let rotationTimer = null;

function showSlide(index){
  slideEls.forEach((el, i) => el.classList.toggle("active", i === index));
  dotEls.forEach((d, i) => d.classList.toggle("active", i === index));
  updateProgressCounter(index);
}

function scheduleNext(){
  if (freezeParam) return; // プレビュー用：ローテーションを開始/再開しない
  let durSec = 12;
  try {
    durSec = activeSlides[currentIndex].duration || 12;
  } catch (e) {
    console.error("duration取得エラー:", e);
  }
  const ms = Math.max(2000, (durSec * 1000) / speedParam);
  rotationTimer = setTimeout(tick, ms);
}

function tick(){
  try {
    currentIndex = (currentIndex + 1) % Math.max(activeSlides.length, 1);
    showSlide(currentIndex);
  } catch (e){
    console.error("ローテーションエラー:", e);
  }
  scheduleNext();
}

showSlide(currentIndex);

// ---------- 夜間モード／日曜帯 ----------
const nightScreenEl = document.getElementById("night-screen");
const sundayBannerEl = document.getElementById("sunday-banner");

nightScreenEl.innerHTML = `
  <div class="kicker">夜間</div>
  <div class="headline small">${CLINIC.name}</div>
  <div class="night-clock" id="night-clock">--:--:--</div>
  <div class="sub">本日の診療は終了しました</div>
  <div class="sub small-sub">診療時間：月〜土 9:00〜　／　詳しくはホームページへ</div>
`;
applyAutoFit(nightScreenEl, false);

// ?hour= が指定されていれば時のみ偽装（分・秒は常に実時刻）。祝日判定はオフラインでは行わない。
function getEffectiveHour(){
  return hourParam !== null ? hourParam : new Date().getHours();
}
function getEffectiveDow(){
  return dowParam !== null ? dowParam : new Date().getDay();
}

let inNightMode = null; // null = 未確定（起動直後の1回目で必ず反映させるための初期値）

function setNightMode(on){
  inNightMode = on;
  if (on){
    if (rotationTimer) clearTimeout(rotationTimer);
    slidesRoot.style.display = "none";
    nightScreenEl.classList.add("active");
    dotsRoot.style.visibility = "hidden";
  } else {
    nightScreenEl.classList.remove("active");
    slidesRoot.style.display = "";
    dotsRoot.style.visibility = "";
  }
}

function applyDayNightMode(){
  try {
    const isSunday = getEffectiveDow() === 0;
    const minute = new Date().getMinutes();
    // 日曜は終日、夜間画面にはせず通常ローテーション＋休診帯を表示する（祝日は非対応）
    const night = !isSunday && isWithinNightWindow(getEffectiveHour(), minute);

    sundayBannerEl.classList.toggle("show", isSunday && !night);

    if (night === inNightMode) return; // 変化なし
    const wasNight = inNightMode;
    setNightMode(night);
    if (!night && wasNight !== null){
      scheduleNext(); // 夜間→通常に切り替わったタイミングでローテーションを再開
    }
  } catch (e){
    console.error("夜間モード判定エラー:", e);
  }
}

applyDayNightMode();
if (!inNightMode){
  scheduleNext(); // 起動時が通常モードならローテーションを開始
}
setInterval(applyDayNightMode, 60 * 1000); // 1分おきに境界時刻をチェック

// ---------- フッター／夜間画面のライブ時計 ----------
function updateClock(){
  try {
    const d = new Date();
    const dateStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAY_KANJI[d.getDay()]}）`;
    const timeStr = [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(n => String(n).padStart(2, "0")).join(":");
    document.getElementById("footer-date").textContent = dateStr;
    document.getElementById("footer-time").textContent = timeStr;
    const nightClockEl = document.getElementById("night-clock");
    if (nightClockEl) nightClockEl.textContent = timeStr;
  } catch (e){
    console.error("時計更新エラー:", e);
  }
}
updateClock();
setInterval(updateClock, 1000);

// ---------- 日付が変わったら自動リロード ----------
const loadDateKey = new Date().toDateString();
setInterval(() => {
  try {
    if (new Date().toDateString() !== loadDateKey){
      location.reload();
    }
  } catch (e){
    console.error("日付チェックエラー:", e);
  }
}, 60 * 60 * 1000); // 1時間おき

// ---------- マウスカーソルの自動非表示 ----------
let idleTimer = null;
function resetIdle(){
  document.body.classList.remove("cursor-hidden");
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    document.body.classList.add("cursor-hidden");
  }, 3000);
}
window.addEventListener("mousemove", resetIdle);
window.addEventListener("mousedown", resetIdle);
resetIdle();
</script>
