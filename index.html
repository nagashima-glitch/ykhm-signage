<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>横浜駅前ながしまクリニック デジタルサイネージ</title>
<style>
  :root{
    --bg-base:#fdfaf5;
    --bg-tint:#f4efe6;
    --text:#2c2a26;
    --text-soft:#5f5b52;
    --line:rgba(44,42,38,0.18);
    --accent:#8a8060;
    --accent2:#5f6b4f;
    --motif-color:#cfc7b2;
    --white:#ffffff;
  }
  html[data-season="spring"]{
    --bg-tint:#fbf1f0; --accent:#c96f88; --accent2:#7fa25e; --motif-color:#eab9c6;
    --night-bg:#2b1f26; --night-accent:#e8b6c4;
  }
  html[data-season="summer"]{
    --bg-tint:#eff8f6; --accent:#3f8fc0; --accent2:#2c6a4f; --motif-color:#9ecfdc;
    --night-bg:#10262a; --night-accent:#7fc4d6;
  }
  html[data-season="autumn"]{
    --bg-tint:#fbf3e4; --accent:#c9803a; --accent2:#a9852c; --motif-color:#e0b06a;
    --night-bg:#2a2013; --night-accent:#e0b06a;
  }
  html[data-season="winter"]{
    --bg-tint:#f1f5fa; --accent:#3c5c88; --accent2:#7c8a99; --motif-color:#b9c4d1;
    --night-bg:#131b2b; --night-accent:#9fb3d6;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    background:var(--bg-base);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    color:var(--text);
    font-feature-settings:"tnum" 1;
    font-variant-numeric:tabular-nums;
  }
  body{
    background:
      radial-gradient(ellipse at 15% 10%, var(--bg-tint) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 90%, var(--bg-tint) 0%, transparent 55%),
      var(--bg-base);
    transition:background 1.5s ease;
  }
  body.cursor-hidden, body.cursor-hidden *{ cursor:none !important; }

  #app{
    position:relative; width:100vw; height:100vh; overflow:hidden;
  }

  /* ---------- 季節の装飾レイヤー ---------- */
  #motif-layer{
    position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .motif-shape{
    position:absolute; border-radius:50%;
    background:var(--motif-color);
    opacity:0.22;
  }
  html[data-season="autumn"] .motif-shape{ border-radius:20% 60% 40% 70%; }
  html[data-season="winter"] .motif-shape{ border-radius:50%; }
  @keyframes driftDown{
    from{ transform:translateY(-10vh) translateX(0) rotate(0deg); }
    to{ transform:translateY(110vh) translateX(6vw) rotate(180deg); }
  }
  @keyframes floatUp{
    0%{ transform:translateY(10vh) translateX(0); }
    50%{ transform:translateY(-4vh) translateX(2vw); }
    100%{ transform:translateY(10vh) translateX(0); }
  }
  .motif-drift{ animation-name:driftDown; animation-timing-function:linear; animation-iteration-count:infinite; }
  .motif-float{ animation-name:floatUp; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }

  .wave-decor{
    position:absolute; left:-10%; right:-10%; bottom:8vh; height:22vh;
    background:var(--bg-tint);
    opacity:0.55;
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    z-index:0;
  }

  /* ---------- スライド共通 ---------- */
  #slides{
    position:absolute; inset:0; top:0; bottom:8vh; z-index:1;
  }
  .slide{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:4vh 6vw;
    opacity:0; transform:translateY(3vh);
    transition:opacity 1s ease, transform 1s ease;
    text-align:center;
  }
  .slide.active{ opacity:1; transform:translateY(0); z-index:2; }

  .kicker{
    font-size:2.6vh; letter-spacing:0.3em; color:var(--accent);
    font-weight:700; margin-bottom:1.6vh;
  }
  .headline{
    font-size:9.5vh; font-weight:900; line-height:1.25; letter-spacing:0.02em;
    color:var(--text);
  }
  .headline.small{ font-size:8vh; }
  .sub{
    font-size:4vh; color:var(--text-soft); margin-top:2.2vh; line-height:1.6; font-weight:500;
  }
  .accent-text{ color:var(--accent2); }

  .dept-list{
    display:flex; flex-wrap:wrap; justify-content:center; gap:1.6vh 1.6vw;
    margin-top:4vh;
  }
  .dept-pill{
    font-size:3.6vh; font-weight:700; color:var(--text);
    border:0.3vh solid var(--accent2); border-radius:100px;
    padding:1.4vh 3vw; background:rgba(255,255,255,0.6);
  }

  .motto-bar{
    margin-top:3vh; font-size:3.2vh; color:var(--accent); font-weight:700; letter-spacing:0.08em;
  }

  /* ---------- 診療時間表 ---------- */
  .hours-wrap{ width:100%; max-width:88vw; }
  table.hours-table{
    width:100%; border-collapse:collapse; margin-top:2vh;
  }
  table.hours-table th, table.hours-table td{
    border-bottom:0.15vh solid var(--line);
    padding:1.8vh 0.6vw;
    font-size:3.4vh;
    text-align:center;
  }
  table.hours-table th{
    color:var(--text-soft); font-weight:700; font-size:3vh;
  }
  table.hours-table td.mark-open{ color:var(--accent2); font-size:4.6vh; font-weight:900; }
  table.hours-table td.mark-close{ color:var(--text-soft); font-size:3.4vh; }
  table.hours-table td.day-label{ font-weight:700; color:var(--text); }
  .hours-note{ margin-top:2.4vh; font-size:2.6vh; color:var(--text-soft); line-height:1.7; }
  .hours-note strong{ color:var(--accent); }

  /* ---------- 内視鏡実績 ---------- */
  .huge-number{
    font-size:22vh; font-weight:900; color:var(--accent2); line-height:1;
    letter-spacing:0.01em;
  }
  .huge-number .unit{ font-size:6vh; margin-left:1vw; color:var(--text); font-weight:700; }
  .breakdown{
    display:flex; gap:6vw; margin-top:4vh; justify-content:center;
  }
  .breakdown .item{ font-size:3.2vh; color:var(--text-soft); }
  .breakdown .item b{ display:block; font-size:6vh; color:var(--accent); font-weight:900; }
  .month-badge{
    margin-top:4vh; font-size:2.8vh; color:var(--text-soft);
    background:rgba(255,255,255,0.6); border-radius:14px; padding:2vh 3vw;
  }
  .month-badge b{ color:var(--accent2); font-size:4vh; }

  /* ---------- 案内リスト（胃/大腸カメラ等） ---------- */
  .point-list{
    margin-top:4vh; display:flex; flex-direction:column; gap:2.2vh; align-items:flex-start;
  }
  .point-list .point{
    font-size:3.8vh; color:var(--text); font-weight:600; text-align:left;
    display:flex; align-items:baseline; gap:1.4vw;
  }
  .point-list .point .dot{
    width:1.6vh; height:1.6vh; border-radius:50%; background:var(--accent);
    flex:none; transform:translateY(-0.6vh);
  }

  /* ---------- 2カラムレイアウト（access等） ---------- */
  .two-col{
    display:flex; gap:5vw; width:100%; max-width:80vw; margin-top:3vh; text-align:left;
  }
  .two-col .col{ flex:1; }
  .access-label{ font-size:2.2vh; color:var(--text-soft); margin-bottom:0.6vh; margin-top:2.4vh; }
  .access-label:first-child{ margin-top:0; }
  .access-line{ font-size:4vh; color:var(--text); font-weight:700; }

  /* ---------- 番号付きリスト（横浜市の検診等） ---------- */
  .numbered-list{
    margin-top:4vh; display:flex; flex-direction:column; gap:2vh; align-items:flex-start;
  }
  .numbered-list .n-item{
    display:flex; align-items:center; gap:1.6vw; font-size:4vh; font-weight:700; color:var(--text);
  }
  .numbered-list .n-badge{
    width:5vh; height:5vh; border-radius:50%; background:var(--accent2); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:2.6vh; font-weight:900; flex:none;
  }

  /* ---------- QRコード（WEB予約） ---------- */
  .qr-layout{ align-items:center; }
  .qr-col{ display:flex; align-items:center; justify-content:center; }
  .qr-card{
    background:#ffffff; border-radius:1.6vh; padding:2vh;
    box-shadow:0 0 0 0.15vh var(--line);
  }
  .qr-image{ display:block; width:35vh; height:35vh; }

  /* ---------- 背景装飾パターン（スライドごとに3種をローテーション） ---------- */
  .slide.bg-pattern-a{
    background-image:radial-gradient(circle, var(--motif-color) 1.4px, transparent 1.4px);
    background-size:4.5vh 4.5vh;
  }
  .slide.bg-pattern-b{
    background-image:
      radial-gradient(ellipse 55% 30% at 15% 105%, var(--bg-tint) 0%, transparent 70%),
      radial-gradient(ellipse 50% 28% at 85% 105%, var(--bg-tint) 0%, transparent 70%);
  }
  .slide.bg-pattern-c{
    background-image:linear-gradient(135deg, var(--bg-tint) 0%, transparent 38%);
  }

  /* ---------- 日曜の帯 ---------- */
  #sunday-banner{
    position:absolute; left:0; right:0; top:0; z-index:4;
    text-align:center; font-size:2.4vh; font-weight:700; color:#fff;
    background:var(--accent2); padding:1.2vh 0;
    opacity:0; pointer-events:none;
    transition:opacity 0.6s ease;
  }
  #sunday-banner.show{ opacity:0.92; }

  /* ---------- 夜間画面 ---------- */
  #night-screen{
    position:absolute; inset:0; bottom:8vh; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:4vh 6vw;
    background:var(--night-bg, #1a1f2b);
    color:#f4f1ea;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity 1s ease, visibility 0s linear 1s, background 1.5s ease;
  }
  #night-screen.active{
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity 1s ease, visibility 0s linear 0s, background 1.5s ease;
  }
  #night-screen .kicker{ color:var(--night-accent, #9fb3d6); }
  #night-screen .headline.small{ color:#f7f4ee; }
  #night-screen .night-clock{
    font-size:14vh; font-weight:900; margin-top:2vh; line-height:1;
    color:var(--night-accent, #9fb3d6); letter-spacing:0.02em;
  }
  #night-screen .sub{ color:#d8d4c8; }
  #night-screen .sub.small-sub{ font-size:2.6vh; margin-top:1.2vh; color:#b9b6ab; }

  /* ---------- フッター ---------- */
  #footer{
    position:absolute; left:0; right:0; bottom:0; height:8vh; z-index:3;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 3vw;
    background:rgba(255,255,255,0.75);
    border-top:0.15vh solid var(--line);
    backdrop-filter:blur(2px);
  }
  #footer .footer-left{ display:flex; align-items:baseline; gap:1.6vw; }
  #footer .clinic-name{ font-size:2.6vh; font-weight:900; color:var(--text); }
  #footer .clinic-loc{ font-size:1.9vh; color:var(--text-soft); }
  #footer .footer-clock{ font-size:2.4vh; font-weight:700; color:var(--text); text-align:center; }
  #footer .footer-clock .date-part{ font-size:1.9vh; color:var(--text-soft); margin-right:1vw; }
  #dots{ display:flex; gap:0.8vh; }
  #dots .dot{
    width:1.1vh; height:1.1vh; border-radius:50%; background:var(--line);
    transition:background 0.4s ease, transform 0.4s ease;
  }
  #dots .dot.active{ background:var(--accent); transform:scale(1.5); }
</style>
</head>
<body>
<div id="app">
  <div id="motif-layer"></div>
  <div class="wave-decor"></div>
  <div id="sunday-banner">本日は休診日です</div>
  <div id="slides"></div>
  <div id="night-screen"></div>
  <footer id="footer">
    <div class="footer-left">
      <span class="clinic-name" id="footer-name"></span>
      <span class="clinic-loc" id="footer-loc"></span>
    </div>
    <div class="footer-clock">
      <span class="date-part" id="footer-date"></span>
      <span id="footer-time"></span>
    </div>
    <div id="dots"></div>
  </footer>
</div>

// ---------- ユーティリティ ----------
function formatNum(n){
  return Number(n).toLocaleString("ja-JP");
}

function renderHoursTable(h){
  const cell = (v, timeOpen, timeNote) => {
    if (v === true) return `<td class="mark-open">○</td>`;
    if (v === "note") return `<td class="mark-open">○</td>`;
    return `<td class="mark-close">×</td>`;
  };
  return `
    <table class="hours-table">
      <thead>
        <tr>
          <th></th>
          ${h.days.map(d => `<th>${d}</th>`).join("")}
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="day-label">午前<br><span style="font-size:1.9vh;color:var(--text-soft);">${h.amTime}</span></td>
          ${h.am.map(v => cell(v)).join("")}
        </tr>
        <tr>
          <td class="day-label">午後<br><span style="font-size:1.9vh;color:var(--text-soft);">${h.pmTime}</span></td>
          ${h.pm.map(v => cell(v)).join("")}
        </tr>
      </tbody>
    </table>
  `;
}

const WEEKDAY_KANJI = ["日", "月", "火", "水", "木", "金", "土"];

function seasonOf(month){
  if ([3, 4, 5].includes(month)) return "spring";
  if ([6, 7, 8, 9].includes(month)) return "summer";
  if ([10, 11].includes(month)) return "autumn";
  return "winter"; // 12, 1, 2
}

// 夜間モードの時間帯（日をまたぐ場合にも対応）かどうかを判定する
function isWithinNightWindow(hour, minute){
  const startMin = NIGHT_MODE.startHour * 60 + NIGHT_MODE.startMinute;
  const endMin = NIGHT_MODE.endHour * 60 + NIGHT_MODE.endMinute;
  const nowMin = hour * 60 + minute;
  if (startMin === endMin) return false; // 設定ミス時は夜間モードにしない
  return nowMin >= startMin || nowMin < endMin;
}

// ---------- URLパラメータ ----------
const params = new URLSearchParams(location.search);
const monthParamRaw = parseInt(params.get("month"), 10);
const monthParam = (monthParamRaw >= 1 && monthParamRaw <= 12) ? monthParamRaw : null;
const speedParam = parseFloat(params.get("speed")) || 1;
const startSlideParam = params.get("slide");

// 整数のみ許可（小数不可）のURLパラメータを読む。範囲外・小数・非数値は null（＝実際の値を使う）
function parseIntParamStrict(name, min, max){
  const raw = params.get(name);
  if (raw === null || raw.includes(".")) return null;
  const n = parseInt(raw, 10);
  if (!Number.isFinite(n) || n < min || n > max) return null;
  return n;
}
const hourParam = parseIntParamStrict("hour", 0, 23);   // 夜間モード判定用（検証用）
const dowParam = parseIntParamStrict("dow", 0, 6);       // 曜日判定用（0=日曜、検証用）

const effectiveMonth = monthParam || (now0.getMonth() + 1);

    el.style.top = (Math.random() * 90) + "vh";

    el.style.animationDuration = duration + "s";
    el.style.animationDelay = (-Math.random() * duration) + "s";
    layer.appendChild(el);
  }
}

// ---------- スライドの絞り込み ----------
function filterSlides(month){
  const isEnabled = s => s.enabled !== false; // enabled:false のスライド（notice等）は非表示にする
  let list = SLIDES.filter(s => isEnabled(s) && (s.months === "all" || (Array.isArray(s.months) && s.months.includes(month))));
  if (list.length === 0) list = SLIDES.filter(s => isEnabled(s) && s.months === "all");
  if (list.length === 0) list = SLIDES.filter(isEnabled);
  return list;
}

// ---------- 表示頻度の重み（weight）を反映した周回リストを作る ----------
// weight:2 のスライドは1周の中で2回表示する。同じスライドが連続しないよう、
// 2回目は「元の位置からおよそ半周ずれた位置」に差し込む。
function buildWeightedRotation(baseList){
  const result = baseList.slice(); // まず1回ずつ並べる
  baseList.forEach(s => {
    const extraCount = Math.max(1, s.weight || 1) - 1; // weight:2 なら追加1回、weight:1（省略時）なら0回
    for (let k = 0; k < extraCount; k++){
      const n = result.length;
      if (n === 0) continue;
      const originalPos = result.indexOf(s);
      let pos = (originalPos + Math.floor(n / 2)) % n;
      // 直前・直後が同じスライドにならないよう、必要ならずらす
      let guard = 0;
      while (
        guard < n &&
        (result[(pos - 1 + n) % n] === s || result[pos % n] === s)
      ){
        pos = (pos + 1) % n;
        guard++;
      }
      result.splice(pos, 0, s);
    }
  });
  return result;
}

const activeSlides = buildWeightedRotation(filterSlides(effectiveMonth));

if (startSlideParam){
  const found = activeSlides.findIndex(s => s.id === startSlideParam);
  if (found >= 0) currentIndex = found;
}

let rotationTimer = null;

function showSlide(index){
  slideEls.forEach((el, i) => el.classList.toggle("active", i === index));
  dotEls.forEach((d, i) => d.classList.toggle("active", i === index));
}

function scheduleNext(){
  let durSec = 12;
  try {
    durSec = activeSlides[currentIndex].duration || 12;
  } catch (e) {
    console.error("duration取得エラー:", e);
  }
  const ms = Math.max(2000, (durSec * 1000) / speedParam);
  rotationTimer = setTimeout(tick, ms);
}

function tick(){
  try {
    currentIndex = (currentIndex + 1) % Math.max(activeSlides.length, 1);
    showSlide(currentIndex);
  } catch (e){
    console.error("ローテーションエラー:", e);
  }
  scheduleNext();
}

showSlide(currentIndex);

// ---------- 夜間モード／日曜帯 ----------
const nightScreenEl = document.getElementById("night-screen");
const sundayBannerEl = document.getElementById("sunday-banner");

nightScreenEl.innerHTML = `
  <div class="kicker">夜間</div>
  <div class="headline small">${CLINIC.name}</div>
  <div class="night-clock" id="night-clock">--:--:--</div>
  <div class="sub">本日の診療は終了しました</div>
  <div class="sub small-sub">診療時間：月〜土 9:00〜　／　詳しくはホームページへ</div>
`;

// ?hour= が指定されていれば時のみ偽装（分・秒は常に実時刻）。祝日判定はオフラインでは行わない。
function getEffectiveHour(){
  return hourParam !== null ? hourParam : new Date().getHours();
}
function getEffectiveDow(){
  return dowParam !== null ? dowParam : new Date().getDay();
}

let inNightMode = null; // null = 未確定（起動直後の1回目で必ず反映させるための初期値）

function setNightMode(on){
  inNightMode = on;
  if (on){
    if (rotationTimer) clearTimeout(rotationTimer);
    slidesRoot.style.display = "none";
    nightScreenEl.classList.add("active");
    dotsRoot.style.visibility = "hidden";
  } else {
    nightScreenEl.classList.remove("active");
    slidesRoot.style.display = "";
    dotsRoot.style.visibility = "";
  }
}

function applyDayNightMode(){
  try {
    const isSunday = getEffectiveDow() === 0;
    const minute = new Date().getMinutes();
    // 日曜は終日、夜間画面にはせず通常ローテーション＋休診帯を表示する（祝日は非対応）
    const night = !isSunday && isWithinNightWindow(getEffectiveHour(), minute);

    sundayBannerEl.classList.toggle("show", isSunday && !night);

    if (night === inNightMode) return; // 変化なし
    const wasNight = inNightMode;
    setNightMode(night);
    if (!night && wasNight !== null){
      scheduleNext(); // 夜間→通常に切り替わったタイミングでローテーションを再開
    }
  } catch (e){
    console.error("夜間モード判定エラー:", e);
  }
}

applyDayNightMode();
if (!inNightMode){
  scheduleNext(); // 起動時が通常モードならローテーションを開始
}
setInterval(applyDayNightMode, 60 * 1000); // 1分おきに境界時刻をチェック

// ---------- フッター／夜間画面のライブ時計 ----------
function updateClock(){
  try {
    const d = new Date();
    const dateStr = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAY_KANJI[d.getDay()]}）`;
    const timeStr = [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map(n => String(n).padStart(2, "0")).join(":");
    document.getElementById("footer-date").textContent = dateStr;
    document.getElementById("footer-time").textContent = timeStr;
    const nightClockEl = document.getElementById("night-clock");
    if (nightClockEl) nightClockEl.textContent = timeStr;
  } catch (e){
    console.error("時計更新エラー:", e);
  }
}
updateClock();
